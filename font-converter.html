<!DOCTYPE html>
<html>
<body>

<input type="file" id="font">

<script>

document.getElementById("font").onchange = function(e){

    let file = e.target.files[0];

    let reader = new FileReader();


    reader.onload=function(){

        let base64 = reader.result
        .split(",")[1];


        console.log(base64);

    };


    reader.readAsDataURL(file);

};

</script>

</body>
</html>
